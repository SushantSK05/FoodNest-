{% extends 'delivery/base.html' %}

{% block title %}Update Restaurant | FoodNest{% endblock %}

{% block content %}
<div class="nav-back-wrap" style="margin-bottom: 20px;">
    <a href="{% url 'open_show_restaurants' %}" class="button secondary" style="display: inline-flex; align-items: center; gap: 8px;">
        ← Back to Restaurants
    </a>
</div>

<section class="form-panel">
    <h2 class="section-heading">Update Restaurant</h2>
    <p class="help-text">Edit restaurant details and save the updated listing.</p>

    <form action="{% url 'update_restaurant' restaurant.id %}" method="post" class="form-grid">
        {% csrf_token %}
        <label for="name">Restaurant name</label>
        <input id="name" type="text" name="name" value="{{ restaurant.name }}" required>

        <label for="picture">Picture URL</label>
        <input id="picture" type="text" name="picture" value="{{ restaurant.picture }}" required>

        <label for="cuisine">Cuisine</label>
        <input id="cuisine" type="text" name="cuisine" value="{{ restaurant.cuisine }}" required>

        <label for="rating">Rating</label>
        <input id="rating" type="number" name="rating" min="0" max="5" step="0.5" value="{{ restaurant.rating }}" required>

        <button class="primary" type="submit">Update Restaurant</button>
    </form>
</section>
{% endblock %}
