<svg xmlns="http://www.w3.org/2000/svg" width="116" height="116" viewBox="0 0 116 116" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFC76B"/>
      <stop offset="50%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="overlay"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#FF4D1E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- animated border ring -->
  <g filter="url(#shadow)">
    <rect x="6" y="6" rx="14" ry="14" width="104" height="104" fill="none" stroke="url(#g2)" stroke-width="4" opacity="0.22"/>
  </g>

  <!-- rounded gradient badge -->
  <rect x="12" y="12" rx="12" ry="12" width="92" height="92" fill="url(#g1)"/>

  <!-- glossy overlay -->
  <rect x="12" y="12" rx="12" ry="12" width="92" height="92" fill="white" opacity="0.06"/>

  <!-- FN initials -->
  <text x="58" y="70" text-anchor="middle" font-family="Aclonica, Arial, sans-serif" font-weight="700" font-size="44" fill="#ffffff">FN</text>

  <!-- fork/spoon small icon (top-right) -->
  <path d="M78 20c1 0 2 .8 2 2v12c0 2-1.5 3.5-3.5 3.5S73 36 73 34V22c0-1.2.9-2 2-2h3zM91 24c.4.4.4 1 .01 1.4L88 29c-.7.6-1 1.6-.7 2.5.2.4.1.9-.3 1.1l1.2 6.8c.15.8-.5 1.5-1.2 1.5-.4 0-.7-.2-.9-.5L83 40c.1-1 .5-1.8 1.1-2.4 1.3-1.2 2.2-2.7 2.4-4.4L91 24z" fill="#fff" opacity="0.95" transform="translate(0,0) scale(0.9)"/>

  <!-- subtle animated sheen -->
  <rect x="12" y="12" rx="12" ry="12" width="92" height="92" fill="url(#g1)" opacity="0" id="sheen" />

  <style>
    /* keep sheen animation, but disable ring rotation for a constant logo */
    @keyframes sheen-move { from { opacity: 0; transform: translateX(-30%); } 50% { opacity: 0.18; transform: translateX(30%);} to { opacity: 0; transform: translateX(80%);} }
    rect[stroke] { transform-origin: 58px 58px; /* no animation - constant ring */ }
    #sheen { animation: sheen-move 3.8s ease-in-out infinite; mix-blend-mode: overlay; }
  </style>
</svg>
